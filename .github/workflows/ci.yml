name: CI

# Audit 2026-06-11, Findings AFB-1 (Content-Safety-Gate) + AFB-6 (CI-Gate).
# Laeuft auf jedem PR gegen main + auf main selbst. In Kombination mit der
# Branch-Protection (PR-Pflicht, dieser Check = required) ersetzt das den
# bisherigen ungeprueften Direct-Push-auf-Prod der import-content-Pipeline.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal-Rechte: der Job liest nur den Code, schreibt nichts.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # AFB-1: gefaehrliche Copy-Paste-Befehle in importiertem Content blocken.
      - name: Content-Safety-Gate
        run: node scripts/check-content-safety.mjs

      - name: Typecheck
        run: pnpm check

      - name: Build
        run: pnpm build
