server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-Fallback: alle nicht-gefundenen Routes auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite gibt Assets content-hashes → safe, ein Jahr cachen
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Hero-Bilder & andere statische Bilder
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # gzip kleinerer Textformate (nginx hat brotli nicht im Alpine-Default)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Security-Header (minimal, kein CSP da inline-styles via shadcn/Tailwind möglich)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
