server {
    # nginx-unprivileged kann keine privilegierten Ports (<1024) binden.
    # Counterpart zum Dockerfile-FROM-Switch (Audit #9-Rest).
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-Fallback: alle nicht-gefundenen Routes auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Audit Finding #26 — bewusst NICHT gefixt: ein `location = /index.html
    # { add_header Cache-Control ... }` würde die nginx-Inheritance brechen
    # (server-level CSP/HSTS würden für /index.html verschwinden = A+
    # Security-Score weg). Browser-Default-Conditional-GET via ETag ist
    # akzeptabel. Saubere Alternative wäre `include security_headers.conf`
    # in jedem location-Block — Overkill für dieses kleine Setup.

    # Vite gibt Assets content-hashes → safe, ein Jahr cachen
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Hero-Bilder & andere statische Bilder
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Audit Finding #10: Hidden Page noindex — Defense-in-depth.
    # Hinweis: ein `location = /secret-import-history` Block würde nicht
    # greifen, weil `try_files $uri /index.html` einen internen Redirect zu
    # /index.html macht der erneut location-Matching durchläuft (→ location /
    # served den Response mit outer headers, ohne X-Robots-Tag). Stattdessen
    # liefert /robots.txt im public-Folder ein Disallow für Crawler. Plus
    # weiter den useEffect-Meta-Tag im React-Component (JS-Crawler).

    # gzip kleinerer Textformate (nginx hat brotli nicht im Alpine-Default)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Audit Finding #3: Vollständige Security-Headers.
    # CSP-Allowlist:
    #   - 'unsafe-inline' für style-src (shadcn/Tailwind inline-styles)
    #   - 'unsafe-inline' für script-src nötig wegen Consent-Mode-v2 Inline-Bootstrap
    #     in client/index.html — würde sonst silently CSP-blocked + GA4 nie fires.
    #     (TODO Phase 2: nonce-Pattern wäre cleaner.)
    #   - googletagmanager.com für gtag.js
    #   - *.google-analytics.com + *.analytics.google.com für Beacons (connect-src)
    #     und Tracking-Pixels (img-src). Spiegelt das StockPilot-Pattern.
    # Fonts sind seit Commit 4ed7ddf self-hosted — fonts.googleapis/gstatic.com
    # bleibt im Allowlist als legacy-safe (kein Egress, da nicht geladen) und
    # wird in Phase 2 raus.
    # server_tokens off bleibt Phase 2 (braucht http-Block-Anpassung).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.google-analytics.com https://*.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
}
