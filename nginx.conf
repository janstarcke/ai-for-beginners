server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-Fallback: alle nicht-gefundenen Routes auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite gibt Assets content-hashes → safe, ein Jahr cachen
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Hero-Bilder & andere statische Bilder
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Audit Finding #10: Hidden Page hartes server-seitiges noindex (das
    # useEffect-Meta-Tag wäre für nicht-JS-Crawler nicht ausreichend).
    location = /secret-import-history {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        # Inherit gleiche security headers + SPA-Fallback
        try_files $uri /index.html;
    }

    # gzip kleinerer Textformate (nginx hat brotli nicht im Alpine-Default)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Audit Finding #3: Vollständige Security-Headers.
    # CSP erlaubt 'unsafe-inline' für style-src (shadcn/Tailwind inline-styles
    # bleiben angewiesen) und font-src für Google Fonts (Playfair Display
    # wird über fonts.googleapis.com geladen). script-src bleibt strict.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
}
