<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Sprint H 2026-05-14: maximum-scale=1 entfernt — blockte Pinch-to-Zoom,
         klassischer A11y-Fail bei Lighthouse. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>AI for Beginners — Claude Code Wissensdatenbank</title>

    <!-- Sprint H: SEO-Meta-Tags. Beschreibung + Social-Sharing-Karten + canonical. -->
    <meta
      name="description"
      content="Kuratierte Wissensdatenbank für Claude Code & Vibe Coding: 63 Skills in 4 Tiers, Token-Spar-Rechner, Setup-Befehle. Von Anfänger zu Profi — auf Deutsch."
    />
    <meta name="theme-color" content="#3a2f28" />
    <link rel="canonical" href="https://ai-for-beginners.starcke.ai/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:site_name" content="AI for Beginners" />
    <meta property="og:title" content="AI for Beginners — Claude Code Wissensdatenbank" />
    <meta
      property="og:description"
      content="63 kuratierte Skills, Token-Spar-Rechner, Setup-Befehle. Vom Anfänger zum Claude-Code-Profi — auf Deutsch."
    />
    <meta property="og:url" content="https://ai-for-beginners.starcke.ai/" />
    <meta property="og:image" content="https://ai-for-beginners.starcke.ai/images/hero-banner.webp" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI for Beginners — Claude Code Wissensdatenbank" />
    <meta
      name="twitter:description"
      content="63 kuratierte Skills, Token-Spar-Rechner, Setup-Befehle. Vom Anfänger zum Claude-Code-Profi — auf Deutsch."
    />
    <meta name="twitter:image" content="https://ai-for-beginners.starcke.ai/images/hero-banner.webp" />

    <!-- Sprint H: LCP-Hero-Image preload-Hint für mobile-Performance.
         fetchpriority=high signalisiert dem Browser dass das Bild kritisch ist. -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-banner.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Schriftarten werden selbst gehostet (siehe client/src/index.css);
         kein Google-Fonts-CDN, keine IP-Übertragung an Google (DSGVO). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
